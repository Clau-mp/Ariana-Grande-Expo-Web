    <main class="gallery-page">

        <section class="gallery-grid">

            <img class="gallery-img img-large-horizontal" src="media/img/G1.webp" alt="Ariana Grande floating on stage" data-title="A Moment of Light" data-description="This image represents the emotional and immersive atmosphere of the exhibition, where light, music and movement create a delicate visual experience.">

            <img class="gallery-img img-medium" src="media/img/G2.webp" alt="Ariana Grande black and white portrait" data-title="Archive Portrait" data-description="This portrait connects with the archive-inspired aesthetic of the project, using black and white photography to create a more intimate and timeless feeling.">

            <img class="gallery-img img-small" src="media/img/G3.webp" alt="Black and white shoes detail" data-title="Silent Steps" data-description="This image focuses on small visual details that help build the atmosphere of the exhibition. The shoes, the shadow and the black and white style create a quiet and mysterious feeling, as if the visitor were entering Ariana's world step by step. It works as a more intimate archive moment inside the gallery.">

            <img class="gallery-img img-extra-wide" src="media/img/G4.webp" alt="Ariana Grande black and white archive portrait" data-title="Archive Presence" data-description="This image presents Ariana through a more intimate and cinematic point of view. The black and white treatment, the soft grain and the movement of her hair create an archive feeling, as if the viewer were looking at a private moment behind the exhibition. It helps show the emotional and visual side of the Petal Experience.">

            <img class="gallery-img img-studio-wide" src="media/img/G5.webp" alt="Ariana Grande recording studio" data-title="Inside the Studio" data-description="This image shows the creative space behind the music. The recording studio represents the process that happens before the final performance, where voice, sound and emotion start to take shape. It connects the exhibition with Ariana's work as an artist, not only through her image, but also through the intimate moments where her songs are created.">

            <img class="gallery-img img-studio-small" src="media/img/carrusel-photo12.webp" alt="Dark studio screen" data-title="Distant Figure" data-description="This image presents Ariana from a distant and mysterious point of view. The dark background, the empty space and the black and white texture create an archive-like atmosphere, almost as if the viewer were discovering a private fragment of a performance or rehearsal. It adds a quiet and cinematic moment to the gallery, showing how absence, shadow and distance can also communicate emotion.">

            <img class="gallery-img img-square" src="media/img/G7.webp" alt="Black and white flower detail" data-title="Petal Detail" data-description="This image focuses on the floral language of the exhibition. The flower works as a delicate visual symbol connected to the Petal Experience concept, representing softness, memory and emotional transformation. Its black and white treatment makes it feel timeless and helps connect the natural elements of the project with Ariana's more intimate visual identity.">

            <img class="gallery-img img-square" src="media/img/G8.webp" alt="Ariana Grande upside down floral portrait" data-title="Floral Reflection" data-description="This image connects Ariana's portrait with the botanical identity of the exhibition. The flower becomes part of the visual composition, creating a soft and emotional atmosphere where the artist and the Petal Experience concept merge together. It represents the more delicate and intimate side of the project, where beauty, memory and image work as one visual language.">

            <img class="gallery-img img-square" src="media/img/G9.webp" alt="Ariana Grande live performance" data-title="Stage Presence" data-description="This image represents Ariana's connection with the stage and live performance. The composition captures the energy of a concert moment, where music, movement and emotion become part of the same experience. Inside the gallery, it helps show how her artistic identity is not only built through albums and visuals, but also through the powerful atmosphere she creates when performing in front of an audience.">

            <img class="gallery-img img-wide" src="media/img/G10.webp" alt="Studio table with music equipment" data-title="Creative Process" data-description="This image shows the workspace behind the final result. The studio table, the equipment and the dark atmosphere suggest the process of creating music before it becomes public. It adds a more personal and technical layer to the exhibition, showing that Ariana's artistic universe is also built through preparation, sound design and careful creative decisions.">

            <img class="gallery-img img-medium" src="media/img/G11.webp" alt="Ariana Grande singing live" data-title="Voice in Motion" data-description="This image focuses on Ariana's voice as the centre of her artistic identity. The performance moment captures her presence on stage, where emotion, sound and movement come together. It helps the visitor understand how her music is not only listened to, but also experienced visually through gestures, lighting and atmosphere.">

            <img class="gallery-img img-small" src="media/img/carrusel-photo8.webp" alt="Ariana Grande black and white portrait" data-title="Intimate Gaze" data-description="This image presents Ariana through a close and intimate portrait. The black and white treatment, the strong contrast and the shadow across her face create a mysterious and emotional atmosphere. Her gaze becomes the main focus, inviting the viewer to look beyond the public image and connect with a quieter, more personal side of her visual identity.">

            <img class="gallery-img img-wide" src="media/img/G13.webp" alt="Ariana Grande performing on stage" data-title="Performance Energy" data-description="This image captures the intensity of Ariana's live universe. The stage, the lighting and the movement create a powerful atmosphere where music becomes a visual experience. Inside the gallery, it adds a more dynamic moment and shows how her performances transform sound into emotion, presence and spectacle.">
            
            <img class="gallery-img img-wide" src="media/img/G14.webp" alt="Ariana Grande portrait card" data-title="Visual Archive" data-description="This image works like an archive piece inside the exhibition. Its card-like composition makes the portrait feel selected, preserved and displayed as part of Ariana's visual history. It connects with the museum idea of collecting important moments, turning a simple image into a curated object within the Petal Experience.">

            <img class="gallery-img img-small" src="media/img/G15.webp" alt="Stage silhouette" data-title="Shadow and Stage" data-description="This image introduces a darker and more atmospheric moment inside the gallery. The silhouette and stage lighting create a sense of mystery, showing how performance can also be understood through shadows, contrast and movement. It adds depth to the exhibition by representing the emotional space between the artist, the stage and the audience.">

            <img class="gallery-img img-small" src="media/img/G16.webp" alt="Ariana Grande studio scene" data-title="Studio Intimacy" data-description="This image shows a quieter and more personal side of Ariana's creative world. The studio setting suggests a moment away from the stage, where music, image and emotion are developed with more privacy and concentration. Inside the exhibition, it helps balance the energy of the performance images with a more intimate view of the artistic process.">

            <img class="gallery-img img-small" src="media/img/G17.webp" alt="Ariana Grande recording vocals" data-title="Recording Voice" data-description="This image focuses on the act of recording and the importance of voice within Ariana's artistic identity. The microphone and studio atmosphere create a close and intimate feeling, showing the moment where emotion becomes sound. It connects the gallery with the hidden process behind her music, before it reaches the stage or the final album.">

            <img class="gallery-img img-small" src="media/img/G18.webp" alt="Recording studio black and white" data-title="Final Echo" data-description="This image closes the gallery with a quiet reference to the recording space. The black and white tones, the studio equipment and the darker atmosphere suggest the final traces of the creative process. It works as a calm ending to the visual journey, reminding the visitor that behind every image, performance and era, there is always a moment of sound, focus and creation.">

        </section>
